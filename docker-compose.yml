services:
  nano-rs:
    build: ./docker/nano-rs
    restart: unless-stopped
    # No --config flag: starts with empty registry + admin API on :8889.
    # remo pushes app registrations via admin API after each deploy.
    command: ["nano-rs", "run"]
    environment:
      NANO_ADMIN_API_KEY: "${NANO_ADMIN_API_KEY}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8889:8889"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  remo:
    build:
      context: .
      args:
        REMO_VERSION: v0.2.3
        REMO_SHA256: 96859e6d3a5ca77df8f6f0e5a799a0a2f3f611484b570a3ffa059f56c3668cd4
    command: ["remo", "server", "start"]
    restart: unless-stopped
    depends_on:
      nano-rs:
        condition: service_healthy
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - /etc/remo:/etc/remo
      - /var/lib/remo:/var/lib/remo
