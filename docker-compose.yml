services:
  nano-rs:
    build: ./docker/nano-rs
    restart: unless-stopped
    # No --config flag: empty registry on start; remo registers apps via admin API.
    # NANO_HOST / NANO_ADMIN_HOST must be 0.0.0.0 in Docker for port mapping to work.
    command: ["nano-rs", "run"]
    environment:
      NANO_ADMIN_API_KEY: "${NANO_ADMIN_API_KEY}"
      NANO_ADMIN_HOST: "0.0.0.0"
      NANO_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8889:8889"
    volumes:
      - /var/lib/remo:/var/lib/remo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  remo:
    build:
      context: .
    command: ["remo", "server", "start"]
    environment:
      REMO_NANO_SOCKET: "http://nano-rs:8889"
    restart: unless-stopped
    depends_on:
      nano-rs:
        condition: service_healthy
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - /etc/remo:/etc/remo
      - /var/lib/remo:/var/lib/remo
